[project]
name = "pyserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "accelerate~=1.0",
    "numpy~=1.21",
    "torch~=2.4.0",
    "huggingface_hub~=0.26",
    "transformers>4.51",
    "protobuf>=5.28.3",
    "sentencepiece>=0.2.0",
    "faker>=30.8.2",
    "bitsandbytes>=0.44.1",
    "datasets>=3.1.0",
    "termcolor>=2.5.0",
    "dp-accounting>=0.4.4",
    "requests>=2.31.0",
    # Stage 3.2 quality axis. Scoring runs offline on finished answers, so this
    # never competes with generation for GPU. See dprag/quality.py.
    "bert-score>=0.3.13",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]

# Make `dprag` importable from experiments/ and tests/ without sys.path hacks.
# uv installs it in editable mode on `uv sync`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dprag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Install the CUDA build of torch (for the RTX 4060) instead of the default
# CPU-only Windows wheel from PyPI. Change cu124 -> cu121/cu118 if needed.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
